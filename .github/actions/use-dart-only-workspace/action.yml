name: Use Dart-only workspace
description: Excludes Flutter packages when CI runs with a standalone Dart SDK.

inputs:
  workspace-root:
    description: Workspace root relative to GITHUB_WORKSPACE.
    default: .

runs:
  using: composite
  steps:
    - name: Configure Dart-only workspace
      shell: bash
      run: |
        workspace_root="$GITHUB_WORKSPACE/${{ inputs.workspace-root }}"
        root_pubspec="$workspace_root/pubspec.yaml"
        override="$workspace_root/pubspec_overrides.yaml"

        {
          echo "# Generated by .github/actions/use-dart-only-workspace."
          echo "workspace:"
          awk '
            /^workspace:[[:space:]]*$/ { in_workspace = 1; next }
            in_workspace && /^  - / {
              sub(/^  - /, "")
              print
              next
            }
            in_workspace && /^[^[:space:]]/ { exit }
          ' "$root_pubspec" | while IFS= read -r package; do
            package_pubspec="$workspace_root/$package/pubspec.yaml"
            if ! grep -Eq '^[[:space:]]+sdk:[[:space:]]+flutter([[:space:]]*(#.*)?)?$' "$package_pubspec"; then
              printf '  - %s\n' "$package"
            fi
          done
        } > "$override"
