name: Publish PostgreSQL image

# Builds and publishes ghcr.io/serverpod/postgres, the official Serverpod
# PostgreSQL image (PostgreSQL + pgvector + PostGIS) used by the docker-compose
# file of newly created projects and by this repo's own docker test stacks.
# Recipe: docker/postgres/Dockerfile.
#
# Publishing happens on main when a push there changes the recipe, and on
# workflow_dispatch, which can publish from any branch. A pull request touching
# the recipe or its smoke gate builds and smoke-tests every platform without
# pushing.
#
# Every publish mints a package version: the tags move to the new digest and the
# version they moved off becomes untagged, and that untagged pile is what a
# careless prune deletes - taking the live image down with it. So the image is
# republished only when a change calls for it.
on:
  workflow_dispatch:
    inputs:
      base_image:
        description: >-
          Base image to build on. Defaults to pgvector/pgvector:pg16.
        default: ''
      extra_tag:
        description: >-
          Additional tag to publish, e.g. a preview tag when testing from a
          branch. The version tags below are always published as well.
        default: ''
      dry_run:
        description: 'Build and smoke-test only, do not push.'
        type: boolean
        default: false
  # Only what determines the published artifact triggers a push-time publish.
  # Editing the README or smoke.sh changes no layer, and rebuilding for them
  # would mint a new digest and orphan the old one for nothing.
  push:
    branches: [main]
    paths:
      - 'docker/postgres/Dockerfile'
      - '.github/workflows/publish-postgres-image.yaml'
  pull_request:
    paths:
      - 'docker/postgres/Dockerfile'
      - 'docker/postgres/smoke.sh'
      - '.github/workflows/publish-postgres-image.yaml'

permissions:
  contents: read

# All publishing events share one group because they update the same rolling
# tags, even when a dispatch originates from another branch. PR validation runs
# are isolated by ref, disposable, and may be cancelled.
concurrency:
  group: publish-postgres-image-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DEFAULT_BASE_IMAGE: pgvector/pgvector:pg16
      PLATFORMS: linux/amd64,linux/arm64
      LOCAL_TAG_AMD64: serverpod-postgres:smoke-amd64
      LOCAL_TAG_ARM64: serverpod-postgres:smoke-arm64
      # Busts the apt layer's cache key, so a build re-resolves packages instead
      # of reusing a layer cached before an upstream update. Only a manual
      # dispatch asks for that - a recipe change already changes the layer, and
      # a per-run value everywhere would mean the layer cache never hits, so the
      # arm64 build would pay a full emulated apt install on every pull request.
      PACKAGE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && github.run_id || 'pinned' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Ahead of the resolve step below, which uses buildx to pin the base
      # image's digest.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Resolve base image, tags and publish mode
        id: cfg
        env:
          # Dispatch inputs are read through the environment, never inlined
          # into the script body.
          BASE_IMAGE_INPUT: ${{ inputs.base_image }}
          EXTRA_TAG_INPUT: ${{ inputs.extra_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          requested="${BASE_IMAGE_INPUT:-}"
          [ -n "$requested" ] || requested="$DEFAULT_BASE_IMAGE"
          # GHCR namespaces are lowercase; the org name may not be.
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/postgres"

          # Pin the base to the digest it resolves to right now, and hand that
          # one reference to the version probe below and to all three builds.
          # A tag is mutable and every build passes --pull, so each would
          # re-resolve it independently: an upstream push mid-run could publish
          # an image whose base was never smoke-tested, and nothing downstream
          # would notice. The digest has to name the multi-platform index, not
          # one platform's manifest, or the arm64 build has nothing to build.
          case "$requested" in
            *@sha256:*)
              # Already immutable - take it as given.
              base="$requested"
              ;;
            *)
              digest="$(docker buildx imagetools inspect "$requested" --format '{{.Manifest.Digest}}')"
              case "$digest" in
                sha256:*) ;;
                *) echo "::error::could not resolve $requested to a digest (got '$digest')"; exit 1 ;;
              esac
              # Strip the tag, but only a real tag: the last colon belongs to a
              # registry port, not a tag, when what follows it contains a slash.
              name="$requested"
              case "${requested##*:}" in
                */*) ;;
                *) name="${requested%:*}" ;;
              esac
              base="$name@$digest"
              ;;
          esac

          # The tag names the major the image actually carries, so read the
          # version off the base rather than trust the tag it was requested
          # under - `pgvector/pgvector:pg16` is a promise about the base's
          # contents, not a guarantee. --entrypoint bypasses
          # docker-entrypoint.sh, which would otherwise reason about
          # initialising a data directory.
          docker pull --quiet "$base" >/dev/null
          version="$(docker run --rm --entrypoint postgres "$base" --version | awk '{print $3}')"
          case "$version" in
            [0-9]*.[0-9]*) ;;
            *) echo "::error::could not read a PostgreSQL version from $base (got '$version')"; exit 1 ;;
          esac
          major="${version%%.*}"

          # Major-version tags only. A project pins the major it was created
          # against and gets patch and extension updates within it; nothing we
          # publish can ever move it to a different major. That rules out
          # `latest`, which would do exactly that to a compose file nobody
          # revisits, and it rules out patch tags like 16.14, which read as
          # pins but still change whenever the image is rebuilt - pin by digest
          # when a project genuinely needs a frozen database.
          tags="$image:pg$major"$'\n'"$image:$major"
          if [ -n "${EXTRA_TAG_INPUT:-}" ]; then
            # A dispatch input joins a newline-separated tag list, so hold it
            # to what a docker tag may actually contain.
            case "$EXTRA_TAG_INPUT" in
              *[!A-Za-z0-9._-]* | [!A-Za-z0-9_]*)
                echo "::error::extra_tag '$EXTRA_TAG_INPUT' is not a valid docker tag"; exit 1 ;;
            esac
            tags="$tags"$'\n'"$image:$EXTRA_TAG_INPUT"
          fi

          if [ "$EVENT" = 'pull_request' ] || [ "${DRY_RUN:-false}" = 'true' ]; then
            push=false
          else
            push=true
          fi

          {
            echo "base=$base"
            echo "requested=$requested"
            echo "image=$image"
            echo "version=$version"
            echo "major=$major"
            echo "push=$push"
            echo "tags<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "base image: $requested pinned to $base (PostgreSQL $version), push: $push"
          echo "tags:"; echo "$tags"

      # Skipped on pull requests and dry runs - a fork's GITHUB_TOKEN cannot
      # write packages, and neither can publish anyway.
      - name: Log in to GitHub Container Registry
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build each architecture separately and load it into the local daemon so
      # the smoke test can run it. QEMU runs arm64 on the amd64 Actions runner;
      # the multi-arch publish build below reuses both sets of layers.
      - name: Build (amd64, for the smoke test)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/postgres
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ steps.cfg.outputs.base }}
            PACKAGE_REFRESH=${{ env.PACKAGE_REFRESH }}
          pull: true
          load: true
          tags: ${{ env.LOCAL_TAG_AMD64 }}
          cache-from: type=gha

      - name: Smoke-test the image (amd64)
        run: docker/postgres/smoke.sh "$LOCAL_TAG_AMD64" linux/amd64

      - name: Build (arm64, for the smoke test)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/postgres
          platforms: linux/arm64
          build-args: |
            BASE_IMAGE=${{ steps.cfg.outputs.base }}
            PACKAGE_REFRESH=${{ env.PACKAGE_REFRESH }}
          pull: true
          load: true
          tags: ${{ env.LOCAL_TAG_ARM64 }}
          cache-from: type=gha

      # Gate: an image that cannot load both extensions on either architecture
      # must never be pushed. This is the same script a developer can run
      # against a local build or a published tag.
      - name: Smoke-test the image (arm64)
        run: docker/postgres/smoke.sh "$LOCAL_TAG_ARM64" linux/arm64

      - name: Build and push
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/postgres
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            BASE_IMAGE=${{ steps.cfg.outputs.base }}
            PACKAGE_REFRESH=${{ env.PACKAGE_REFRESH }}
          pull: true
          # On a pull request or dry run the result is discarded instead of
          # pushed; the builds and runtime smoke tests above still validate both
          # platforms before a recipe can be merged or deliberately published.
          push: ${{ steps.cfg.outputs.push }}
          tags: ${{ steps.cfg.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published manifest
        if: steps.cfg.outputs.push == 'true'
        env:
          REF: ${{ steps.cfg.outputs.image }}:${{ steps.cfg.outputs.major }}
        run: |
          set -euo pipefail
          out="$(docker buildx imagetools inspect "$REF")"
          echo "$out"
          for platform in ${PLATFORMS//,/ }; do
            grep -qE "Platform:[[:space:]]+$platform([[:space:]]|$)" <<< "$out" \
              || { echo "::error::published manifest for $REF is missing $platform"; exit 1; }
          done

      - name: Summary
        env:
          TAGS: ${{ steps.cfg.outputs.tags }}
          PUSHED: ${{ steps.cfg.outputs.push }}
          BASE: ${{ steps.cfg.outputs.base }}
          REQUESTED: ${{ steps.cfg.outputs.requested }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            if [ "$PUSHED" = 'true' ]; then echo '### Published'; else echo '### Built (not published)'; fi
            echo
            echo "- Base image: \`$REQUESTED\`, pinned to \`$BASE\`"
            echo "- Platforms: \`$PLATFORMS\`"
            [ -z "$DIGEST" ] || echo "- Digest: \`$DIGEST\`"
            echo "- Tags:"
            while IFS= read -r tag; do [ -z "$tag" ] || echo "  - \`$tag\`"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
