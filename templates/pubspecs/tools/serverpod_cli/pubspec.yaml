# TEMPLATE

name: serverpod_cli
version: SERVERPOD_VERSION
description: Command line tools for Serverpod.
repository: https://github.com/serverpod/serverpod

environment:
  sdk: DART_VERSION

resolution: workspace

dependencies:
  analyzer: '>=8.1.0 <11.0.0'
  archive: ^4.0.0
  args: ^2.7.0
  async: ^2.11.0
  ci: ^0.1.0
  cli_tools: ^0.13.2
  code_assets: ^1.0.0
  # 4.12.0 reorders the generated `ignore_for_file` comments and deprecates
  # `Expression.expression`, breaking `serverpod generate` verification and
  # `dart analyze`. Unpin once the generator is updated for it.
  code_builder: '>=4.5.0 <4.12.0'
  collection: ^1.18.0
  config: ^0.9.0
  dart_data_home: ^0.1.0
  dart_mcp: '>=0.4.1 <0.6.0'
  dart_style: ^3.1.7
  data_assets: '>=0.19.0 <0.20.0'
  ffi: ^2.1.4
  file: ^7.0.1
  hooks: ^1.0.0
  hooks_runner: ^1.2.1
  http: '>=1.1.0 <2.0.0'
  intl: '>=0.19.0 <0.21.0'
  isolated_object: ^0.1.0
  json_rpc_2: ^4.0.0
  # Bridge type only: hooks_runner's NativeAssetsBuildRunner requires a
  # Logger argument. All log records are forwarded to the serverpod CLI
  # logger; we never call package:logging methods directly.
  logging: ^1.2.0
  lsp_server: ^0.4.0
  meta: ^1.15.0
  nocterm: ^0.9.0
  package_config: ^2.1.0
  path: ^1.8.3
  pub_api_client: '>=2.4.0 <4.0.0'
  pub_semver: ^2.1.4
  pubspec_parse: ^1.5.0
  # Nocterm permits quiver 3.0.0, which cannot compile on Dart 3.
  quiver: ^3.2.2
  recase: ^4.1.0
  serverpod_database: SERVERPOD_VERSION
  serverpod_embedded_postgres: SERVERPOD_VERSION
  serverpod_logging_cli: ^0.1.0
  serverpod_serialization: SERVERPOD_VERSION
  serverpod_service_client: SERVERPOD_VERSION
  serverpod_shared: SERVERPOD_VERSION
  serverpod_tui: ^0.12.0
  skills: ^0.3.1
  source_span: ^1.10.0
  stream_channel: ^2.1.1
  stream_transform: ^2.1.0
  uuid: ^4.5.3
  vm_service: '>=13.0.0 <16.0.0'
  watcher: ^1.0.2
  whiskers: ^0.1.1
  win32: ^6.0.1
  yaml: ^3.1.2
  yaml_edit: ^2.2.2

dev_dependencies:
  postgres: ^3.4.0
  serverpod_lints: SERVERPOD_VERSION
  term_glyph: ^1.2.2
  test: ^1.25.5
  test_descriptor: ^2.0.2

executables:
  serverpod: serverpod_cli
