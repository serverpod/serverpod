# TEMPLATE

name: serverpod_database
version: SERVERPOD_VERSION
description: Database implementations for Serverpod.
repository: https://github.com/serverpod/serverpod
homepage: https://serverpod.dev
issue_tracker: https://github.com/serverpod/serverpod/issues

environment:
  sdk: DART_VERSION

resolution: workspace

dependencies:
  collection: ^1.18.0
  meta: ^1.15.0
  path: ^1.8.3
  # Draft integration for #5916; use a hosted release before publishing.
  postgres:
    git:
      url: https://github.com/marcelomendoncasoares/postgresql-dart.git
      ref: 79560a928c6b9307e89fe52f368f68dfce01eb79
  serverpod_embedded_postgres: SERVERPOD_VERSION
  serverpod_serialization: SERVERPOD_VERSION
  serverpod_shared: SERVERPOD_VERSION
  sqlite3: ^3.3.1
  # sqlite3_web 0.9.5 made WorkerDatabase base, which sqlite_async 0.14.5
  # does not compile against.
  sqlite3_web: '>=0.9.4 <0.9.5'
  sqlite_async: ^0.14.4
  sqlparser: ^0.45.1

dev_dependencies:
  serverpod_lints: SERVERPOD_VERSION
  test: ^1.25.5
  test_descriptor: ^2.0.2
