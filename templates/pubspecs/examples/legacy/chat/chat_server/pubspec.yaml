# TEMPLATE

# Frozen at Serverpod 4.0.0-beta.0 together with the legacy chat module, see
# issue #5443. The chat packages are unpublished, hence the path overrides.

name: chat_server
description: Starting point for a Serverpod server.

environment:
  sdk: '^3.12.2'

dependencies:
  serverpod: 4.0.0-beta.0
  serverpod_auth_server: 4.0.0-beta.0
  serverpod_chat_server: 4.0.0-beta.0

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'

dependency_overrides:
  serverpod_chat_server:
    path: ../../../../modules/legacy/serverpod_chat/serverpod_chat_server
