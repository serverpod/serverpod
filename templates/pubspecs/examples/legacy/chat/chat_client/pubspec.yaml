# TEMPLATE

# Frozen at Serverpod 4.0.0-beta.0 together with the legacy chat module, see
# issue #5443. The chat packages are unpublished, hence the path overrides.

name: chat_client
description: Starting point for a Serverpod client.

environment:
  sdk: '^3.10.3'

dependencies:
  serverpod_auth_client: 4.0.0-beta.0
  serverpod_chat_client: 4.0.0-beta.0
  serverpod_client: 4.0.0-beta.0

dependency_overrides:
  serverpod_chat_client:
    path: ../../../../modules/legacy/serverpod_chat/serverpod_chat_client
