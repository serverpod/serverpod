# TEMPLATE

# Frozen at Serverpod 4.0.0-beta.0: this module depends on the legacy streaming
# API, which is removed in later releases. No version slots on purpose, see
# issue #5443.
# serverpod_chat_client is unpublished at this version, hence the path override.

name: serverpod_chat_flutter
description: Flutter widgets for the Serverpod chat module.
version: 4.0.0-beta.0
repository: https://github.com/serverpod/serverpod
homepage: https://serverpod.dev
issue_tracker: https://github.com/serverpod/serverpod/issues

environment:
  sdk: '^3.10.3'
  flutter: '^3.38.4'

dependencies:
  file_picker: '>=8.1.0 <11.0.0'
  flutter:
    sdk: flutter
  intl: '>=0.19.0 <0.21.0'
  path: ^1.8.3
  serverpod_auth_client: 4.0.0-beta.0
  serverpod_auth_shared_flutter: 4.0.0-beta.0
  serverpod_chat_client: 4.0.0-beta.0
  url_launcher: ^6.1.10
  web: '>=0.3.0 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  serverpod_lints: 4.0.0-beta.0

dependency_overrides:
  serverpod_chat_client:
    path: ../serverpod_chat_client
