name: serverpod_workspace
publish_to: none

environment:
  sdk: '^3.12.2'

workspace:
  - examples/auth/*
  # `auth_example_flutter` is intentionally excluded, see
  # util/non_workspace_packages.
  - examples/legacy/auth_example/auth_example_client
  - examples/legacy/auth_example/auth_example_server
  - examples/middleware/*
  - integrations/*
  # `serverpod_auth_google_flutter` is intentionally excluded, see
  # util/non_workspace_packages.
  - modules/legacy/serverpod_auth/serverpod_auth_apple_flutter
  - modules/legacy/serverpod_auth/serverpod_auth_client
  - modules/legacy/serverpod_auth/serverpod_auth_email_flutter
  - modules/legacy/serverpod_auth/serverpod_auth_firebase_flutter
  - modules/legacy/serverpod_auth/serverpod_auth_server
  - modules/legacy/serverpod_auth/serverpod_auth_shared_flutter
  - modules/serverpod_auth/*/*
  - packages/*
  - tests/*
  - tests/*/*
  - tools/*

dev_dependencies:
  melos: ^8.0.0
  sort_pubspec_dependencies: ^0.0.2

melos:
  command:
    bootstrap:
      hooks:
        # Resolve the packages that cannot join the workspace. The lists, and
        # why each package is excluded, live in util/non_workspace_packages and
        # util/template_packages.
        post: cd "$MELOS_ROOT_PATH" && util/pub_get_non_workspace && util/pub_get_templates
  scripts:
    # The lint scripts analyze the workspace and, via
    # util/analyze_non_workspace, the packages that are not workspace members.
    # Melos is a dev_dependency rather than a global install, so it is not on
    # the PATH: nested invocations have to go through `dart run melos`.
    lint:
      description: Analyze every package, warnings fatal.
      steps:
        - dart run melos exec --ignore="serverpod_templates" -- dart analyze --fatal-warnings
        - util/analyze_non_workspace --fatal-warnings
    lint_loose:
      description: Analyze every package, nothing fatal beyond errors.
      steps:
        - dart run melos exec --ignore="serverpod_templates" -- dart analyze
        - util/analyze_non_workspace
    lint_strict:
      description: Analyze every package, infos and warnings fatal.
      steps:
        - dart run melos exec --ignore="serverpod_templates" -- dart analyze --fatal-infos --fatal-warnings
        - util/analyze_non_workspace --fatal-infos --fatal-warnings
    test:
      description: >-
        Run the primary host test suites via `dart test`. Embedded PostgreSQL is
        provisioned by the tests and the serverpod CLI is run from source. The
        bootstrap group includes Dockerfile and Compose checks on non-Windows
        hosts, and Redis-tagged integration tests require Redis at redis:6379.
        Stops at the first failing suite. The e2e and Dockerized Flutter suites
        are excluded.
      steps:
        - test_unit
        - test_bootstrap
        - test_integration
        - test_non_workspace
    test_unit:
      description: Unit tests across all Dart-only packages.
      run: dart run melos exec --concurrency 1 --no-flutter --dir-exists=test --ignore="serverpod_cli_e2e_test" --ignore="bootstrap_project" --ignore="serverpod_templates" --ignore="modulename*" --ignore="projectname*" -- dart test -x integration --reporter=failures-only
      env:
        SERVERPOD_SILENCE_LIFECYCLE_MESSAGES: "1"
    test_bootstrap:
      description: Project-bootstrap tests (create + perform-create).
      run: dart run melos exec --concurrency 1 --scope="bootstrap_project" -- "SERVERPOD_HOME=\"$MELOS_ROOT_PATH\" dart test --reporter=failures-only && SERVERPOD_HOME=\"$MELOS_ROOT_PATH\" dart test test_perform_create --reporter=failures-only"
      env:
        SERVERPOD_SILENCE_LIFECYCLE_MESSAGES: "1"
    test_integration:
      description: >-
        Integration tests (no Docker). The PostgreSQL server and module suites
        provision their own database on the shared embedded postmaster on demand;
        the SQLite server suite runs against on-disk SQLite.
      steps:
        - test_integration_server
        - test_integration_modules
        - test_integration_sqlite_server
    test_non_workspace:
      description: >-
        Unit tests of the packages that are not workspace members, which
        `melos exec` cannot reach. See util/non_workspace_packages. Needs the
        Flutter SDK, since most of these packages are Flutter packages.
      run: util/run_tests_non_workspace
    test_integration_embedded_pg_build:
      description: >-
        Build the embedded PostgreSQL bundle from source in an isolated cache,
        then run its package integration tests and the host integration suite.
        Requires the native PostgreSQL bundle build toolchain.
      run: bash util/run_tests_integration_embedded_pg_build
    test_integration_server:
      description: serverpod_test_server integration tests (real-server-boot + withServerpod).
      run: dart run melos exec --concurrency 1 --scope="serverpod_test_server" -- "set -e && dart run bin/main.dart -m production -r maintenance --apply-migrations > /dev/null && dart test test_integration -x integration --reporter=failures-only && dart test test_integration/test_tools/start_timeout_test/test_that_will_not_timeout.dart --name '__warmup_no_match__' > /dev/null 2>&1 || true && INTEGRATION_TEST_SERVERPOD_MODE=test dart test test_integration -t integration --reporter=failures-only"
      env:
        SERVERPOD_SILENCE_LIFECYCLE_MESSAGES: "1"
        SERVERPOD_DATABASE_DATA_PATH: ".serverpod/test/pgdata"
        TZ: "UTC"
    test_integration_modules:
      description: auth/module/nonvector server integration tests.
      run: dart run melos exec --concurrency 1 --scope="serverpod_auth_test_server" --scope="serverpod_test_module_server" --scope="serverpod_test_nonvector_server" -- dart test -t integration --reporter=failures-only
      env:
        SERVERPOD_SILENCE_LIFECYCLE_MESSAGES: "1"
        SERVERPOD_DATABASE_DATA_PATH: ".serverpod/test/pgdata"
        TZ: "UTC"
    test_integration_sqlite_server:
      description: serverpod_test_sqlite_server integration tests (SQLite, on host).
      run: dart run melos exec --concurrency 1 --scope="serverpod_test_sqlite_server" -- "set -e && rm -f sqlite_data/*.db* && dart run bin/main.dart -m production -r maintenance --apply-migrations && dart test test_integration --concurrency=1 --reporter=failures-only"
      env:
        SERVERPOD_SILENCE_LIFECYCLE_MESSAGES: "1"
    upgrade_flutter:
      run: dart run melos exec --flutter --ignore="serverpod_templates" -- flutter pub upgrade
    upgrade_dart:
      run: dart run melos exec --no-flutter --ignore="serverpod_templates" -- dart pub upgrade
    upgrade:
      run: dart run melos upgrade_flutter && dart run melos upgrade_dart
    downgrade_flutter:
      run: dart run melos exec --flutter --ignore="serverpod_templates" -c 1 -- flutter pub downgrade
    downgrade_dart:
      run: dart run melos exec --no-flutter --ignore="serverpod_templates" -c 1 -- dart pub downgrade
    downgrade:
      run: dart run melos downgrade_flutter && dart run melos downgrade_dart
    sort_pubspec_dependencies:
      run: dart run melos exec -- "cd \"\$SERVERPOD_HOME\" && dart run sort_pubspec_dependencies --pubspec-path=\"\$MELOS_PACKAGE_PATH/pubspec.yaml\""

serverpod_cli:
  analyze_pubspecs:
    ignore_packages:
      - google_sign_in
      - sign_in_with_apple
