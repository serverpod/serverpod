name: serverpod_workspace
publish_to: none

environment:
  sdk: '^3.11.3'

workspace:
  - examples/auth/auth_client
  - examples/auth/auth_flutter
  - examples/auth/auth_server
  - examples/middleware/middleware_client
  - examples/middleware/middleware_flutter
  - examples/middleware/middleware_server
  - integrations/cloud_storage_integration_test_support
  - integrations/serverpod_cloud_storage_gcp
  - integrations/serverpod_cloud_storage_r2
  - integrations/serverpod_cloud_storage_s3
  - integrations/serverpod_cloud_storage_s3_compat
  - modules/serverpod_auth/serverpod_auth_bridge/serverpod_auth_bridge_client
  - modules/serverpod_auth/serverpod_auth_bridge/serverpod_auth_bridge_flutter
  - modules/serverpod_auth/serverpod_auth_bridge/serverpod_auth_bridge_server
  - modules/serverpod_auth/serverpod_auth_core/serverpod_auth_core_client
  - modules/serverpod_auth/serverpod_auth_core/serverpod_auth_core_flutter
  - modules/serverpod_auth/serverpod_auth_core/serverpod_auth_core_server
  - modules/serverpod_auth/serverpod_auth_idp/serverpod_auth_idp_client
  - modules/serverpod_auth/serverpod_auth_idp/serverpod_auth_idp_flutter
  - modules/serverpod_auth/serverpod_auth_idp/serverpod_auth_idp_flutter_facebook
  - modules/serverpod_auth/serverpod_auth_idp/serverpod_auth_idp_flutter_firebase
  - modules/serverpod_auth/serverpod_auth_idp/serverpod_auth_idp_server
  - modules/serverpod_auth/serverpod_auth_migration/serverpod_auth_migration_client
  - modules/serverpod_auth/serverpod_auth_migration/serverpod_auth_migration_server
  - packages/serverpod
  - packages/serverpod_client
  - packages/serverpod_database
  - packages/serverpod_embedded_postgres
  - packages/serverpod_flutter
  - packages/serverpod_lints
  - packages/serverpod_serialization
  - packages/serverpod_service_client
  - packages/serverpod_shared
  - packages/serverpod_test
  - tests/bootstrap_project
  - tests/serverpod_auth_test/serverpod_auth_test_client
  - tests/serverpod_auth_test/serverpod_auth_test_flutter
  - tests/serverpod_auth_test/serverpod_auth_test_server
  - tests/serverpod_cli_e2e_test
  - tests/serverpod_test_client
  - tests/serverpod_test_flutter
  - tests/serverpod_test_module/serverpod_test_module_client
  - tests/serverpod_test_module/serverpod_test_module_server
  - tests/serverpod_test_nonvector/serverpod_test_nonvector_client
  - tests/serverpod_test_nonvector/serverpod_test_nonvector_server
  - tests/serverpod_test_server
  - tests/serverpod_test_shared
  - tests/serverpod_test_shared_module/serverpod_test_shared_module_client
  - tests/serverpod_test_shared_module/serverpod_test_shared_module_server
  - tests/serverpod_test_shared_module/serverpod_test_shared_module_shared
  - tests/serverpod_test_sqlite/serverpod_test_sqlite_client
  - tests/serverpod_test_sqlite/serverpod_test_sqlite_flutter
  - tests/serverpod_test_sqlite/serverpod_test_sqlite_server
  - tests/serverpod_test_sqlite/serverpod_test_sqlite_shared
  - tools/serverpod_cli

dev_dependencies:
  melos: ^8.0.0
  sort_pubspec_dependencies: ^0.0.2

melos:
  scripts:
    lint:
      run: melos exec --ignore="serverpod_templates" -- dart analyze --fatal-warnings
    lint_loose:
      run: melos exec --ignore="serverpod_templates" -- dart analyze
    lint_strict:
      run: melos exec --ignore="serverpod_templates" -- dart analyze --fatal-infos --fatal-warnings
    test:
      description: >-
        Run the primary host test suites via `dart test`. Embedded PostgreSQL is
        provisioned by the tests and the serverpod CLI is run from source. The
        bootstrap group includes Dockerfile and Compose checks on non-Windows
        hosts, and Redis-tagged integration tests require Redis at redis:6379.
        Stops at the first failing suite. The e2e and Dockerized Flutter suites
        are excluded.
      steps:
        - test_unit
        - test_bootstrap
        - test_integration
    test_unit:
      description: Unit tests across all Dart-only packages.
      run: melos exec --concurrency 1 --no-flutter --dir-exists=test --ignore="serverpod_cli_e2e_test" --ignore="bootstrap_project" --ignore="serverpod_templates" --ignore="modulename*" --ignore="projectname*" -- dart test -x integration --reporter=failures-only
      env:
        SERVERPOD_SILENCE_LIFECYCLE_MESSAGES: "1"
    test_bootstrap:
      description: Project-bootstrap tests (create + perform-create).
      run: melos exec --concurrency 1 --scope="bootstrap_project" -- "SERVERPOD_HOME=\"$MELOS_ROOT_PATH\" dart test --reporter=failures-only && SERVERPOD_HOME=\"$MELOS_ROOT_PATH\" dart test test_perform_create --reporter=failures-only"
      env:
        SERVERPOD_SILENCE_LIFECYCLE_MESSAGES: "1"
    test_integration:
      description: >-
        Integration tests (no Docker). The PostgreSQL server and module suites
        provision their own database on the shared embedded postmaster on demand;
        the SQLite server suite runs against on-disk SQLite.
      steps:
        - test_integration_server
        - test_integration_modules
        - test_integration_sqlite_server
    test_integration_embedded_pg_build:
      description: >-
        Build the embedded PostgreSQL bundle from source in an isolated cache,
        then run its package integration tests and the host integration suite.
        Requires the native PostgreSQL bundle build toolchain.
      run: bash util/run_tests_integration_embedded_pg_build
    test_integration_server:
      description: serverpod_test_server integration tests (real-server-boot + withServerpod).
      run: melos exec --concurrency 1 --scope="serverpod_test_server" -- "set -e && dart run bin/main.dart -m production -r maintenance --apply-migrations > /dev/null && dart test test_integration -x integration --reporter=failures-only && dart test test_integration/test_tools/start_timeout_test/test_that_will_not_timeout.dart --name '__warmup_no_match__' > /dev/null 2>&1 || true && INTEGRATION_TEST_SERVERPOD_MODE=test dart test test_integration -t integration --reporter=failures-only"
      env:
        SERVERPOD_SILENCE_LIFECYCLE_MESSAGES: "1"
        SERVERPOD_DATABASE_DATA_PATH: ".serverpod/test/pgdata"
        TZ: "UTC"
    test_integration_modules:
      description: auth/module/nonvector server integration tests.
      run: melos exec --concurrency 1 --scope="serverpod_auth_test_server" --scope="serverpod_test_module_server" --scope="serverpod_test_nonvector_server" -- dart test -t integration --reporter=failures-only
      env:
        SERVERPOD_SILENCE_LIFECYCLE_MESSAGES: "1"
        SERVERPOD_DATABASE_DATA_PATH: ".serverpod/test/pgdata"
        TZ: "UTC"
    test_integration_sqlite_server:
      description: serverpod_test_sqlite_server integration tests (SQLite, on host).
      run: melos exec --concurrency 1 --scope="serverpod_test_sqlite_server" -- "set -e && rm -f sqlite_data/*.db* && dart run bin/main.dart -m production -r maintenance --apply-migrations && dart test test_integration --concurrency=1 --reporter=failures-only"
      env:
        SERVERPOD_SILENCE_LIFECYCLE_MESSAGES: "1"
    upgrade_flutter:
      run: melos exec --flutter --ignore="serverpod_templates" -- flutter pub upgrade
    upgrade_dart:
      run: melos exec --no-flutter --ignore="serverpod_templates" -- dart pub upgrade
    upgrade:
      run: melos upgrade_flutter && melos upgrade_dart
    downgrade_flutter:
      run: melos exec --flutter --ignore="serverpod_templates" -c 1 -- flutter pub downgrade
    downgrade_dart:
      run: melos exec --no-flutter --ignore="serverpod_templates" -c 1 -- dart pub downgrade
    downgrade:
      run: melos downgrade_flutter && melos downgrade_dart
    sort_pubspec_dependencies:
      run: melos exec -- "cd \"\$SERVERPOD_HOME\" && dart run sort_pubspec_dependencies --pubspec-path=\"\$MELOS_PACKAGE_PATH/pubspec.yaml\""

serverpod_cli:
  analyze_pubspecs:
    ignore_packages:
      - google_sign_in
      - sign_in_with_apple
