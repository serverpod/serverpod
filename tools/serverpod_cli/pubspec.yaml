  # Pinned exactly, not ranged: the generator formats the code it writes, so a
  # dart_style change is a change to every generated file in every project. An
  # exact pin keeps that under our control instead of a `pub upgrade`'s.
  #
  # It no longer has to match the `dart_style` bundled with the user's SDK.
  # Serverpod supports Dart 3.10+, which spans the fix for
  # https://github.com/dart-lang/dart_style/issues/1785, and no single version
  # can match both sides of it. Code is now ensured to be stable by adding a
  # trailing comma to enums before calling the formatter.
  #
  # 3.1.7 is the latest version compatible with analyzer <11. Version 3.1.8
  # adds Dart 3.13 support but requires analyzer 12, so upgrade both
  # dependencies together when Serverpod targets Dart 3.13.
  dart_style: 3.1.7
