# Many side of a named one-to-many relation. `companyId` is generated from `fk`.
# `previousCompanyId` is generated as nullable because of `optional`.
class: FkRelationEmployee
table: fk_relation_employee
fields:
  name: String
  company: FkRelationCompany?, relation(name=fk_relation_company_employees, fk)
  previousCompany: FkRelationCompany?, relation(optional, fk)
