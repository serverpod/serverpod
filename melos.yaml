name: serverpod

packages:
  - examples/**
  - integrations/*
  - modules/**
  - packages/*
  - tests/**
  - tools/*

# The legacy chat module is frozen at Serverpod 4.0.0-beta.0 and must not be
# linked to the workspace packages by melos, see issue #5443.
# The legacy auth packages are kept out of the Pub workspace because their
# google_sign_in / sign_in_with_apple constraints conflict with the current
# auth packages and cannot be resolved in a single shared dependency graph.
# The auth_example depends on those legacy packages, so it is excluded too.
ignore:
  - modules/legacy/serverpod_chat/**
  - modules/legacy/serverpod_auth/**
  - examples/legacy/chat/**
  - examples/legacy/auth_example/**
  # Scratch projects generated by the CLI tests, they are not workspace members.
  - tests/temp/**
